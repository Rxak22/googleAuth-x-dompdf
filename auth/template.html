<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        padding: 40px;
        background: #fff;
        color: #333;
      }
      .logo {
        display: block;
        margin-bottom: 30px;
      }
      h1 {
        font-size: 28px;
        font-weight: 600;
        margin-bottom: 30px;
        color: #222;
        border-bottom: 3px solid #007cba;
        padding-bottom: 10px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 30px;
        border: 1px solid #ddd;
      }
      thead {
        background: #f5f5f5;
      }
      th {
        padding: 12px 15px;
        text-align: left;
        font-weight: 600;
        color: #222;
        border-bottom: 2px solid #007cba;
      }
      td {
        padding: 12px 15px;
        border-bottom: 1px solid #eee;
      }
      tbody tr:last-child td {
        border-bottom: none;
      }
      footer {
        text-align: center;
        margin-top: 30px;
        font-size: 12px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <img src="./example.jpg" width="70" class="logo" />

    <h1>User Credential</h1>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>{{name}}</td>
          <td>{{email}}</td>
        </tr>
      </tbody>
    </table>

    <footer>Continue building!</footer>
  </body>
</html>
